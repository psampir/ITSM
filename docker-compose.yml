# Course template - Lab 1 compose contract (API.md section 9), extended by Lab 3 (MONITORING-SPEC.md M-01, M-02).
# The checker enforces: a service named exactly "svcdesk", port 8080 inside the container,
# SVCDESK_TEST_CLOCK set, no host-path bind mounts on svcdesk or kb-index, and images that need
# no network once built (dependencies are installed at build time, never at start).
services:
  svcdesk:
    build: .                      # copy Dockerfile.example to Dockerfile, or write your own
    ports:
      - "8080:8080"               # recommended for local work; the checker removes it in container mode
    environment:
      SVCDESK_TEST_CLOCK: "1"     # required: enables the X-Test-Clock header (API.md section 8)
      KB_INDEX_URL: http://kb-index:8080   # M-02; the code falls back to this value when unset
    volumes:
      - svcdesk-data:/data        # a NAMED volume is fine; "./data:/data" (a bind mount) fails check 1.02
    depends_on:
      - kb-index                  # optional: `docker compose up svcdesk` then starts kb-index too
    # healthcheck makes "docker compose up --wait" wait for readiness.
    # python:3.13-slim has no curl, so this one uses Python.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # Lab 3 dependency: the course knowledge-base index, latency-seeded from your GitHub login (M-01).
  # No healthcheck: the image has no shell and no curl, so `docker compose up --wait` would fail (1.04).
  kb-index:
    image: ghcr.io/swasik/seeded-toxic:2026
    environment:
      SEEDED_TOXIC_LOGIN: "psampir"   # the GitHub login your receipts carry
    ports:
      - "8081:8080"                    # optional: /stats and /admin/degrade from the laptop

  # Your own observability stack (Lab 3, profile "observability"). The checker never starts it.
  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro

  grafana:
    image: grafana/grafana:13.2.3
    profiles: ["observability"]
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"   # dashboards readable without a login;
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer  # log in as admin (password admin at first) to edit
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

  # Stretch 2 (L3-STRETCH-2, M-30): Toxiproxy in front of svcdesk, for the client-server gap.
  #   docker compose --profile gap up -d toxiproxy
  # then create the proxy and its toxic through the API on 8474 (HANDOUT.md, Stretch 2); the proxy listens on 8666.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0     # the tag has no "v"
    profiles: ["gap"]
    ports:
      - "8474:8474"                             # the API
      - "8666:8666"                             # the proxy in front of svcdesk

  # Stretch S3 (own tests): the runner lives at src/tests/run.py (importable as tests.run from /app/src).
  # The checker builds every image up front, then runs `docker compose --profile tests run --rm --build tests`
  # (300 s cap), requiring exit 0 and a last stdout line "ITSMLAB-TESTS: passed=<n> failed=0" with n >= 10.
  # The tests image installs everything at build time, like svcdesk, and reaches only SVCDESK_URL.
  tests:
    build: .
    profiles: ["tests"]
    working_dir: /app/src
    depends_on:
      svcdesk:
        condition: service_healthy
    environment:
      SVCDESK_URL: http://svcdesk:8080
    command: ["python", "-m", "tests.run"]

volumes:
  svcdesk-data:
